[project]
name = "hometrack-temporal-worker"
version = "0.1.0"
description = "Temporal worker for processing field media in HomeTrack"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
